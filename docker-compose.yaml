services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: self-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: self-rag-app
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      USE_VLLM: "true"
      VLLM_BASE_URL: http://vllm:8000/v1
    depends_on:
      qdrant:
        condition: service_started
      vllm:
        condition: service_healthy
    restart: unless-stopped

  vllm:
    build:
      context: ./vllm
      dockerfile: Dockerfile
    container_name: self-rag-vllm
    ports:
      - "8001:8000"
    environment:
      MODEL_NAME: Qwen/Qwen2.5-7B-Instruct-AWQ
      QUANTIZATION: awq
      GPU_MEMORY_UTILIZATION: "0.95"
      MAX_MODEL_LEN: "8192"
      MAX_NUM_SEQS: "128"
      GUIDED_DECODING_BACKEND: outlines
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  qdrant_data:
  huggingface_cache: