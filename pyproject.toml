[project]
name = "basic-self-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-litellm>=0.7.0",
    "langchain-openai>=1.4.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "litellm>=1.95.0",
    "mcp[cli]>=2.0.0",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "scipy>=1.18.0",
    "sentence-transformers>=5.2.0",
    "fastembed>=0.7.4",
    "torch>=2.6.0",
    "rich>=13.0.0",
    "uvicorn>=0.30.0",
    "flashrank>=0.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_rag"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
